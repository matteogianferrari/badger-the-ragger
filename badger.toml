# Paths are resolved relative to this configuration file; ~ is expanded.
notes_root = "/home/matteo/Documenti/Obsidian Vault/Zettelkasten"
index_path = ".badger/index.sqlite3"

# The default model is openly licensed (Apache 2.0). The first use downloads it.
model_name = "Qwen/Qwen3-Embedding-0.6B"
device = "auto" # auto, cpu, cuda, cuda:0, mps, etc.
batch_size = 32
min_paragraph_chars = 90
top_k = 10
# If notes_root is a SilverBullet space, exclude its script/config pages here.
# exclude_globs = ["CONFIG.md", "Library/**", "Badger.md"]

# Applied only to queries. Change this freely without rebuilding the index.
query_prompt = "Instruct: Given an idea or concept, retrieve passages from personal notes that are semantically related.\nQuery: "
